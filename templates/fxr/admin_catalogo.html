{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="container mt-3" style="max-width:800px">
  <a href="{{ url_for('fxr.index') }}" class="btn btn-sm btn-outline-secondary mb-2">← FxR</a>
  <h2 class="text-info">{{ titulo }}</h2>
  <form method="post" class="row g-2 mb-4">
    <input type="hidden" name="id" value="">
    <div class="col-md-3"><input name="codigo" class="form-control bg-black text-white border-secondary" placeholder="Código" required></div>
    <div class="col-md-5"><input name="nombre" class="form-control bg-black text-white border-secondary" placeholder="Nombre" required></div>
    <div class="col-md-2 form-check d-flex align-items-center ms-2">
      <input class="form-check-input" type="checkbox" name="activo" id="act" checked>
      <label class="form-check-label text-white ms-1" for="act">Activo</label>
    </div>
    <div class="col-md-2"><button class="btn btn-success w-100">Agregar</button></div>
  </form>
  <table class="table table-dark table-sm">
    <thead><tr><th>ID</th><th>Código</th><th>Nombre</th><th>Activo</th><th></th></tr></thead>
    <tbody>
    {% for i in items %}
      <tr>
        <td colspan="5" class="p-2">
          <form method="post" class="row g-2 align-items-center">
            <input type="hidden" name="id" value="{{ i.id }}">
            <div class="col-1">{{ i.id }}</div>
            <div class="col-2"><input name="codigo" value="{{ i.codigo }}" class="form-control form-control-sm bg-black text-white border-secondary"></div>
            <div class="col-4"><input name="nombre" value="{{ i.nombre }}" class="form-control form-control-sm bg-black text-white border-secondary"></div>
            <div class="col-2">
              <label class="text-white small"><input type="checkbox" name="activo" {% if i.activo %}checked{% endif %}> Activo</label>
            </div>
            <div class="col-2"><button class="btn btn-sm btn-outline-light">Guardar</button></div>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
