{% extends "base.html" %}
{% block title %}DespachoWeb — Orden {{ orden.n_orden }}{% endblock %}
{% block content %}
<div class="container mt-3" style="max-width: 960px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-white h4 mb-0">Editar orden N° {{ orden.n_orden }}</h2>
        <div class="d-flex gap-2">
            <a href="{{ url_for('despacho_web.orden_imprimir', n_orden=orden.n_orden) }}" class="btn btn-outline-light btn-sm" target="_blank">🖨 Imprimir factura</a>
            <a href="{{ url_for('despacho_web.ordenes') }}" class="btn btn-outline-light btn-sm">← Volver</a>
        </div>
    </div>

    <div id="alertOk" class="alert alert-success d-none"></div>
    <div id="alertErr" class="alert alert-danger d-none"></div>

    <form id="formOrdenEdit">
        <div class="card bg-dark border-secondary mb-3">
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-4">
                        <label class="form-label text-white-50 small">N° Orden</label>
                        <input type="text" class="form-control bg-black text-white border-secondary" value="{{ orden.n_orden }}" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white-50 small">Fecha O.C</label>
                        <input type="date" name="fecha_oc" class="form-control bg-black text-white border-secondary" value="{{ orden.fecha_oc.isoformat() if orden.fecha_oc else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white-50 small">Estado</label>
                        <select name="estado" class="form-select bg-black text-white border-secondary">
                            {% for e in estados %}
                            <option value="{{ e }}" {% if orden.estado == e %}selected{% endif %}>{{ e }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-white-50 small">Cliente</label>
                        <input type="text" name="cliente" class="form-control bg-black text-white border-secondary" value="{{ orden.cliente }}">
                    </div>
                    <div class="col-md-8">
                        <label class="form-label text-white-50 small">Dirección completa (Maps)</label>
                        <input type="text" name="direccion" id="direccion" class="form-control bg-black text-white border-secondary" value="{{ orden.direccion }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-white-50 small">Comuna</label>
                        <input type="text" name="comuna" class="form-control bg-black text-white border-secondary" value="{{ orden.comuna or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-white-50 small">Celular</label>
                        <input type="text" name="celular" id="celular" class="form-control bg-black text-white border-secondary" value="{{ orden.celular }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-white-50 small">Email</label>
                        <input type="email" name="email" class="form-control bg-black text-white border-secondary" value="{{ orden.email or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-white-50 small">Transporte</label>
                        <select name="transporte" class="form-select bg-black text-white border-secondary">
                            {% for t in transportes %}
                            <option value="{{ t }}" {% if (orden.transporte or '') == t %}selected{% endif %}>{{ t or '— Sin asignar —' }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-white-50 small">Obs.</label>
                        <input type="text" name="obs" class="form-control bg-black text-white border-secondary" value="{{ orden.obs or '' }}">
                    </div>
                </div>
            </div>
        </div>

        <div class="card bg-dark border-secondary mb-3">
            <div class="card-header border-secondary d-flex justify-content-between align-items-center">
                <span class="text-white">Detalle O.C</span>
                <button type="button" class="btn btn-sm btn-outline-light" id="btnAddLinea">+ Línea</button>
            </div>
            <div class="card-body" id="lineasDetalle"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger flex-grow-1" id="btnGuardar">Guardar cambios</button>
            <button type="button" class="btn btn-outline-danger" id="btnEliminar">Eliminar orden</button>
        </div>
    </form>

    <form id="formEliminar" method="post" action="{{ url_for('despacho_web.orden_eliminar', n_orden=orden.n_orden) }}" class="d-none"></form>
</div>

<script>
window.DW_EDIT = {
    lineasIniciales: {{ detalle|tojson }},
    productos: {{ productos|map(attribute='nombre')|list|tojson }},
    guardarUrl: {{ url_for('despacho_web.orden_editar', n_orden=orden.n_orden)|tojson }}
};
</script>
<script src="{{ url_for('static', filename='js/despacho_web_editar.js') }}?v=1"></script>
{% endblock %}
